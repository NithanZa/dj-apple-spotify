[project]
name = "rekordbox-migrator"
version = "0.1.0"
description = "Migrate rekordbox DJ prep from Apple Music to Spotify entries"
authors = [
    { name = "NithanZa", email = "jaroonekp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyrekordbox>=0.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rekordbox-migrator = "rekordbox_migrator:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
